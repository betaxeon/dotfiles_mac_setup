# Match the visual configuration used by WezTerm.
theme = Rose Pine Moon
font-family = Hack Nerd Font
font-size = 15

# Mirror WezTerm's translucent, blurred macOS window.
background-opacity = 0.8
background-blur = 50

# Approximate WezTerm's 50%-brightness inactive panes. Ghostty dims inactive
# splits with an overlay rather than changing their saturation.
unfocused-split-opacity = 0.5
unfocused-split-fill = #232136

# Rose Pine Moon's highlight-low color keeps split boundaries subtle.
split-divider-color = #393552
