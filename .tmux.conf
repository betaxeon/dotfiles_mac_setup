##### Core behaviour #####

set -g mouse on
set -g history-limit 100000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g focus-events on
set -g escape-time 10

# Make mouse behavior explicit for WezTerm.
# Click focuses tmux panes; wheel scrolls tmux history instead of shell history.
bind-key -n MouseDown1Pane select-pane -t= \; if-shell -F "#{||:#{pane_in_mode},#{alternate_on}}" "send-keys -M"
bind-key -n WheelUpPane if-shell -F "#{||:#{pane_in_mode},#{alternate_on}}" "send-keys -M" "copy-mode -e"
bind-key -n WheelDownPane if-shell -F "#{||:#{pane_in_mode},#{alternate_on}}" "send-keys -M"


##### Colour / terminal support #####

set -g default-terminal "tmux-256color"
set -as terminal-features ',xterm-256color:RGB'
set -as terminal-features ',wezterm:RGB'


##### macOS / WezTerm clipboard support #####

set -s set-clipboard external

##### Keep tmux default shortcuts #####
# Prefix remains Ctrl-b
# New window:       Ctrl-b c
# Split vertical:   Ctrl-b %
# Split horizontal: Ctrl-b "
# Detach:           Ctrl-b d
# Copy mode:        Ctrl-b [
# Paste buffer:     Ctrl-b ]
# List windows:     Ctrl-b w
# List sessions:    Ctrl-b s
# Help:             Ctrl-b ?

# WezTerm maps Cmd-w to Prefix W.
bind-key W confirm-before -p "Kill current window #I:#W? (y/n)" kill-window


##### Status bar #####

set -g status-position bottom
set -g status-interval 5
set -g status-left-length 40
set -g status-right-length 100

set -g status-left " #S "
set -g status-right "#{?client_prefix, PREFIX ,} %Y-%m-%d %H:%M "

setw -g window-status-format " #I:#W "
setw -g window-status-current-format " #I:#W* "


